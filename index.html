<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#193b34"><title>PA 練習本</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="brand-icon">PA</span><h1>PA 練習本</h1></div><button id="browse" class="quiet">題庫 <span id="total">110</span></button></header>
<main>
<div class="topline"><span id="category">定義</span><span id="position">載入中</span></div><div class="track"><div id="progress"></div></div>
<div id="review-banner" hidden><span>待加強複習</span><button id="exit-review" class="quiet">回到全部</button></div><section class="question"><div class="question-tools"><span class="eyebrow">EXAM PA · PRACTICE</span><button id="edit-current" class="quiet">編輯</button><button id="mark-card" class="tag-button" aria-pressed="false">☆ 待加強</button></div><h2 id="question">正在載入題庫…</h2></section>
<form id="answer-form"><label for="answer">你的答案 <span id="word-count">0 words</span></label><textarea id="answer" placeholder="Write your answer here…" spellcheck="false" autocapitalize="sentences" maxlength="12000" rows="8" aria-describedby="draft-note"></textarea><p id="draft-note" class="subtle">先寫下來，再對答案。</p><div class="actions"><button type="submit" class="primary" id="check">對答案 <span>↗</span></button><button type="button" id="reveal" class="secondary">直接看答案</button></div></form>
<section id="results" hidden aria-live="polite"><div class="section-heading"><h3>對照答案</h3><span id="result-label" class="subtle"></span></div><p class="subtle" id="diff-note">標記的是文字差異；不同寫法不一定是錯誤。</p><div class="legend"><span><i class="missing"></i>原卡用字</span><span><i class="extra"></i>你的用字</span></div><div id="diff" class="english diff"></div><div id="step-detail" class="step-detail"></div><details id="original"><summary>查看完整原卡答案</summary><div id="original-answer" class="english original"></div></details><div class="ai-row"><div><h3>這樣寫對不對？</h3><p id="ai-status" class="subtle">AI 服務待設定，現在可以先比對文字。</p></div><button id="ai-check" class="secondary" disabled>AI 檢查</button></div><div id="ai-result" hidden></div><div class="review-actions"><button id="copy" class="quiet copy">複製給 AI 檢查</button><button id="retry" class="quiet copy">重練本題</button></div></section>
<footer><button id="previous" class="quiet">← 上一題</button><span id="done-count" class="subtle">已練 0 題</span><button id="next" class="quiet">下一題 →</button></footer><p id="notice" role="status"></p>
</main><dialog id="library"><div class="dialog-heading"><h2>題庫</h2><button id="new-card" class="secondary">＋ 新增題目</button><button id="close-library" class="quiet" aria-label="關閉題庫">✕</button></div><input type="search" id="search" placeholder="搜尋題目…" aria-label="搜尋題目"><div class="filters"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="marked" aria-pressed="false" id="marked-filter">★ 待加強 0</button><button data-filter="定義" aria-pressed="false">定義</button><button data-filter="比較與優缺點" aria-pressed="false">比較與優缺點</button><button data-filter="自訂" aria-pressed="false">自訂</button></div><button id="start-review" class="secondary" hidden>開始複習待加強題目</button><div id="card-list"></div></dialog>
<dialog id="add-dialog"><div class="dialog-heading"><h2 id="editor-title">新增題目</h2><button id="close-add" class="quiet" aria-label="關閉新增題目">✕</button></div><form id="add-form"><label for="new-question">題目</label><textarea id="new-question" rows="2" maxlength="1000" required placeholder="例如：Target leakage"></textarea><label for="new-answer">參考答案</label><textarea id="new-answer" rows="6" maxlength="12000" required placeholder="輸入你想練習的標準答案…"></textarea><p class="subtle" id="editor-help">儲存後加入自訂題庫，可逐字比對與 AI 檢查。</p><p id="add-error" role="alert"></p><div class="actions"><button id="save-card" type="submit" class="primary">新增並開始練習</button><button id="cancel-add" type="button" class="secondary">取消</button></div></form></dialog>
<script>const APP_VERSION='2026-09-29-9';const CHANGELOG=['電腦版新增的題目推上 GitHub 後，手機會自動載入新題庫。'];</script><script type="module" src="app.js"></script></body></html>
